<section
  class="relative isolate overflow-hidden bg-[var(--color-background)] py-[4.5rem] md:py-24 lg:py-[7.5rem]"
  aria-labelledby="testimonials-heading"
  (pointerenter)="onPointerEnter()"
  (pointerleave)="onPointerLeave()"
>
  <div class="pointer-events-none absolute inset-0 -z-10" aria-hidden="true">
    <div
      class="absolute inset-0 bg-[radial-gradient(circle_at_12%_20%,rgb(198_40_40_/_0.06),transparent_42%),radial-gradient(circle_at_88%_78%,rgb(17_17_17_/_0.04),transparent_40%)]"
    ></div>

    <img
      ngSrc="/images/Screens/screen-circle.png"
      width="520"
      height="520"
      alt=""
      loading="lazy"
      class="absolute -left-[40%] -top-[40%] size-[400px] select-none opacity-90 sm:size-[380px] lg:-left-[20%] lg:-top-[70%] lg:size-[960px]"
    />

    <img
      ngSrc="/images/Screens/screen-1.png"
      width="1200"
      height="400"
      alt=""
      loading="lazy"
      class="absolute -right-62 top-12 w-[min(95vw,760px)] max-w-none origin-top-right rotate-45 select-none opacity-90
                 sm:-right-[20%] sm:top-[40%] sm:w-[min(85vw,920px)] lg:w-[1200px]"
    />
  </div>

  <div class="relative z-10">
    <div class="mx-auto mb-10 flex w-full max-w-[var(--container-width)] justify-center px-4 md:px-8">
      <app-section-title [title]="'testimonials'" [headingId]="'testimonials-heading'" />
    </div>

    <div class="mx-auto w-full max-w-[var(--container-width)] px-4 md:px-8">
      <div
        #viewport
        class="cursor-grab overflow-hidden py-1 active:cursor-grabbing"
      >
        <div class="flex touch-pan-y">
          @for (item of testimonials; track item.id) {
            <div
              class="min-w-0 shrink-0 grow-0 basis-full px-3 sm:basis-1/2 lg:basis-1/3"
            >
              <app-testimonials-card [testimonial]="item" />
            </div>
          }
        </div>
      </div>

      <div class="mt-8 flex items-center justify-between gap-4">
        <div class="flex flex-wrap gap-2" role="tablist" aria-label="Testimonial slides">
          @for (snap of scrollSnaps(); track $index; let i = $index) {
            <button
              type="button"
              class="size-2 rounded-full border-0 p-0 transition-[transform,background-color] duration-200 ease-out"
              [class.scale-125]="selectedIndex() === i"
              [ngClass]="
                selectedIndex() === i
                  ? 'bg-[var(--color-primary)]'
                  : 'bg-[var(--color-border)]'
              "
              [attr.aria-label]="'Go to testimonial ' + (i + 1)"
              [attr.aria-selected]="selectedIndex() === i"
              role="tab"
              (click)="scrollTo(i)"
            ></button>
          }
        </div>

        <div class="flex gap-3">
          <app-carousel-button
            [direction]="'prev'"
            [ariaLabel]="'Previous testimonials'"
            [disabled]="!canScrollPrev()"
            (pressed)="scrollPrev()"
          />
          <app-carousel-button
            [direction]="'next'"
            [ariaLabel]="'Next testimonials'"
            [disabled]="!canScrollNext()"
            (pressed)="scrollNext()"
          />
        </div>
      </div>
    </div>
  </div>
</section>
