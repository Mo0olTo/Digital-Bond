<button
  type="button"
  class="inline-flex size-11 items-center justify-center rounded-[var(--radius-button)] border transition-[transform,background-color,border-color,opacity] duration-200 ease-out hover:scale-105 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-35"
  [ngClass]="
    variant() === 'dark'
      ? 'border-white/20 bg-white/5 text-white hover:border-[var(--color-primary)] hover:bg-white/10 focus-visible:border-[var(--color-primary)]'
      : 'border-[var(--color-border)] bg-[var(--color-surface)] text-[var(--color-text-primary)] hover:border-[var(--color-primary)] hover:bg-[var(--color-primary-light)] focus-visible:border-[var(--color-primary)]'
  "
  [attr.aria-label]="ariaLabel()"
  [disabled]="disabled()"
  (click)="pressed.emit()"
>
  <lucide-icon
    [name]="direction() === 'prev' ? 'chevron-left' : 'chevron-right'"
    [size]="20"
    aria-hidden="true"
  />
</button>
