@if (activeBackground(); as background) {
  <section
    class="relative isolate min-h-[220px] w-full overflow-hidden bg-[var(--color-background)] sm:min-h-[280px] md:min-h-[920px]"
    [attr.aria-label]="background.alt"
  >
    <div class="pointer-events-none absolute inset-0" aria-hidden="true">
      @for (image of backgrounds; track image.name) {
        @if (image.name === sectionName()) {
          
            <div class="section-background__media absolute inset-0 size-full overflow-hidden">
              <img
                [ngSrc]="image.src"
                [alt]="image.alt"
                fill
                class="object-cover"
                priority
              />
            </div>
        }
        
      }
    </div> 
   
    @if (title()) {
        <div class="relative z-20 flex min-h-[220px] items-center justify-center px-4 sm:min-h-[280px] md:min-h-[460px] ">

                <h1 class="m-0 text-center text-3xl font-extrabold uppercase tracking-wide
                         text-white sm:text-4xl md:text-5xl lg:text-6xl"
                    aria-label="{{ title() }}">

                    @for (char of title().split(''); track $index) {
                    <span
                        class="inline-block animate-char"
                        [style.animation-delay]="($index * 80) + 'ms'"
                        aria-hidden="true"
                    >
                        {{ char === ' ' ? '\u00A0' : char }}
                    </span>
                    }
                </h1>
        </div>
      
            }
  </section>
}
