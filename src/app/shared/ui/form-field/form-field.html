<div class="form-field flex w-full flex-col items-start justify-center gap-1">
  <label
    class="mb-1 block text-sm font-medium text-[var(--color-primary)]"
    [attr.for]="inputId()"
  >
    {{ label() }}
  </label>

  @if (type() === 'textarea') {
    <textarea
      class="form-field__control"
      [id]="inputId()"
      [rows]="rows()"
      [placeholder]="placeholder()"
      [value]="value()"
      [disabled]="disabled()"
      [attr.aria-invalid]="isInvalid()"
      [attr.aria-describedby]="errorId"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [class.form-field__control--invalid]="isInvalid()"
    ></textarea>
  } @else if (type() === 'tel') {
    <div
      class="form-field__tel relative w-full"
      [class.form-field__tel--invalid]="isInvalid()"
    >
      @if (isBrowser) {
        <intl-tel-input
          [ngModel]="value()"
          [ngModelOptions]="{ standalone: true }"
          [disabled]="disabled()"
          [initialCountry]="initialCountry()"
          [countryOrder]="countryOrder()"
          [countrySearch]="countrySearch()"
          [separateDialCode]="separateDialCode()"
          [matchDropdownWidth]="matchDropdownWidth()"
          [countrySelectorMode]="countrySelectorMode()"
          [showFlags]="true"
          [loadUtils]="loadUtils"
          [inputAttributes]="{
            id: inputId(),
            class: 'pe-11',
            autocomplete: autocomplete() || 'tel',
            'aria-invalid': isInvalid() ? 'true' : 'false',
            'aria-describedby': errorId,
          }"
          (ngModelChange)="onPhoneChange($event)"
          (validityChange)="onPhoneValidityChange($event)"
          (blur)="onBlur()"
        />
      } @else {
        <input
          class="form-field__control form-field__control--tel-fallback pe-11"
          [id]="inputId()"
          type="tel"
          [placeholder]="placeholder()"
          [value]="value()"
          [disabled]="disabled()"
          autocomplete="tel"
          [attr.aria-invalid]="isInvalid()"
          [attr.aria-describedby]="errorId"
          (input)="onInput($event)"
          (blur)="onBlur()"
        />
      }

      @if (isInvalid()) {
        <lucide-icon
          name="circle-x"
          [size]="20"
          class="pointer-events-none absolute end-3 top-1/2 z-10 -translate-y-1/2 text-[var(--color-primary)]"
          aria-hidden="true"
        />
      } @else if (isValid()) {
        <lucide-icon
          name="circle-check"
          [size]="20"
          class="pointer-events-none absolute end-3 top-1/2 z-10 -translate-y-1/2 text-green-600"
          aria-hidden="true"
        />
      }
    </div>
  } @else {
    <div class="relative w-full">
      <input
        class="form-field__control pe-11 text-[var(--color-text-primary)]"
        [id]="inputId()"
        [type]="type()"
        [placeholder]="placeholder()"
        [value]="value()"
        [disabled]="disabled()"
        [attr.autocomplete]="autocomplete() || null"
        [attr.aria-invalid]="isInvalid()"
        [attr.aria-describedby]="errorId"
        (input)="onInput($event)"
        (blur)="onBlur()"
        [class.form-field__control--invalid]="isInvalid()"
      />

      @if (isInvalid()) {
        <lucide-icon
          name="circle-x"
          [size]="20"
          class="pointer-events-none absolute end-3 top-1/2 -translate-y-1/2 text-[var(--color-primary)]"
          aria-hidden="true"
        />
      } @else if (isValid()) {
        <lucide-icon
          name="circle-check"
          [size]="20"
          class="pointer-events-none absolute end-3 top-1/2 -translate-y-1/2 text-green-600"
          aria-hidden="true"
        />
      }
    </div>
  }

  <app-error-msg
    [control]="control"
    [label]="label()"
    [type]="type()"
    [errorId]="errorId"
  />
</div>
