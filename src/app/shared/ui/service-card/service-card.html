<article class="service-card group flex h-full flex-col items-center text-center relative">
  
  <span class="service-card__dot" aria-hidden="true"></span>

  <h3
    class="service-card__title m-0 mt-5 max-w-[10rem] text-[1rem] font-semibold uppercase tracking-[0.18em] text-white sm:text-xs"
  >
    {{ service().title }}
  </h3>

  <div
    class="service-card__icon-wrap mt-5 flex h-24 w-24 items-center justify-center rounded-[1.25rem] transition-[background-color,transform,box-shadow] duration-300 ease-out group-hover:bg-white group-hover:shadow-[var(--shadow-md)] group-focus-within:bg-white"
  >
    <lucide-icon
      [img]="service().icon"
      [size]="40"
      [strokeWidth]="1.5"
      class="service-card__icon text-white transition-colors duration-300 ease-out group-hover:text-[var(--color-primary)] group-focus-within:text-[var(--color-primary)]"
      aria-hidden="true"
    />
  </div> 


</article>
